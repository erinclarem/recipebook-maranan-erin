{% extends "base.html" %}
{% block content %}
    <h2>{{ recipe.name }} Recipe</h2>
    <h4>Author: {{ recipe.author }}</h4>
    <h3>Ingredients:</h3>
    <ul>
        {% for ingredient in recipe.ingredients.all %}
        <li>{{ ingredient.ingredient.name }} - {{ ingredient.quantity }}</li>
        {% endfor %}
    </ul>
{% endblock %}
