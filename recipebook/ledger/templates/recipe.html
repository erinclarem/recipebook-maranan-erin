{% extends "base.html" %}
{% block content %}
    <h2>{{ name }}</h2>
    <h5>Author: {{ recipe.author.name }}</h5>
    <h3>Ingredients:</h3>
    <ul>
        {% for ingredient in recipe.ingredients.all %}
        <li>{{ ingredient.ingredient.name }} - {{ ingredient.quantity }}</li>
        {% endfor %}
    </ul>
{% endblock %}
