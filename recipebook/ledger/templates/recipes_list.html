{% extends "base.html" %}

{% block page_heading %}
    Recipe List
{% endblock %}

{% block content %}
    <ul>
        {% for recipe in recipe_list %}
        <li><p style="font-size: 20px;">
            <a href="{{ recipe.get_absolute_url }}">{{ recipe }}</a>
        </p></li>
        {% endfor %}
    </ul>
    <h3><a href="{% url 'ledger:recipe_create' %}">Add a New Recipe</a></h3>
{% endblock %}
